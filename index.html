<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Calendrier Surprise &lt;3</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f5e6e8, #e8edf5);
      color: #3d3d3d;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 600px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 30px;
      padding: 40px 25px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }

    h1 {
      margin-top: 0;
      font-size: 2.2em;
    }

    .symbol {
      font-size: 3.5em;
      margin: 20px 0;
    }

    .locked,
    .surprise {
      line-height: 1.6;
      font-size: 1.1em;
    }

    .date {
      font-weight: bold;
      margin-top: 20px;
    }

    img,
    video {
      max-width: 100%;
      border-radius: 20px;
      margin-top: 20px;
    }

  </style>
</head>


<body>

  <main class="card">

    <h1>Calendrier Surprise &lt;3</h1>

    <div class="symbol" id="symbol">🐚</div>

    <div id="app"></div>

  </main>


<script>

  const surprises = {

    "1": {
      date: "2026-09-08",
      titre: "8 septembre <3",
      contenu: `
        <p>Bon anniversaire Anna 💌</p>
        <p>Ta surprise sera ajoutée ici plus tard 🐚</p>
      `
    },


    "2": {
      date: "2026-10-03",
      titre: "3 octobre 🍓",
      contenu: `
        <p>Ta surprise sera ajoutée ici plus tard 💌</p>
      `
    },


    "3": {
      date: "2026-11-28",
      titre: "28 novembre 🐚",
      contenu: `
        <p>Ta surprise sera ajoutée ici plus tard 💌</p>
      `
    },


    "4": {
      date: "2026-12-25",
      titre: "25 décembre 🪷",
      contenu: `
        <p>Ta surprise sera ajoutée ici plus tard 💌</p>
      `
    },


    "5": {
      date: "2027-01-01",
      titre: "1 janvier 🧃",
      contenu: `
        <p>Ta surprise sera ajoutée ici plus tard 💌</p>
      `
    },


    "6": {
      date: "2027-02-26",
      titre: "26 février 🙊",
      contenu: `
        <p>Ta surprise sera ajoutée ici plus tard 💌</p>
      `
    },


    "7": {
      date: "2027-03-04",
      titre: "4 mars 🍓",
      contenu: `
        <p>Ta surprise sera ajoutée ici plus tard 💌</p>
      `
    },


    "8": {
      date: "2027-04-17",
      titre: "17 avril 🪷",
      contenu: `
        <p>Ta surprise sera ajoutée ici plus tard 💌</p>
      `
    },


    "9": {
      date: "2027-05-12",
      titre: "12 mai 🐻",
      contenu: `
        <p>Ta surprise sera ajoutée ici plus tard 💌</p>
      `
    },


    "10": {
      date: "2027-06-29",
      titre: "29 juin 🧃",
      contenu: `
        <p>Ta surprise sera ajoutée ici plus tard 💌</p>
      `
    },


    "11": {
      date: "2027-07-08",
      titre: "8 juillet 🐚",
      contenu: `
        <p>Ta surprise sera ajoutée ici plus tard 💌</p>
      `
    },


    "12": {
      date: "2027-08-13",
      titre: "13 août 🍓",
      contenu: `
        <p>Ta surprise sera ajoutée ici plus tard 💌</p>
      `
    },


    "13": {
      date: "2026-10-02",
      titre: "2 octobre 💌",
      contenu: `
        <p>Ta surprise sera ajoutée ici plus tard 🐚</p>
      `
    },


    "14": {
      date: "2027-04-10",
      titre: "10 avril 🍓",
      contenu: `
        <p>Ta surprise sera ajoutée ici plus tard 🪷</p>
      `
    }

  };


  const params = new URLSearchParams(window.location.search);

  const numero = params.get("surprise");

  const app = document.getElementById("app");

  const symbol = document.getElementById("symbol");


  if (!numero || !surprises[numero]) {

    symbol.textContent = "🐚";

    app.innerHTML = `

      <h2>Bienvenue &lt;3</h2>

      <p>
        Scanne un QR code de ton calendrier
        pour découvrir une petite surprise 💌
      </p>

      <p>
        🙊 🧃 🍓 🐚 🪷 🐻
      </p>

    `;

  }


  else {

    const surprise = surprises[numero];

    const dateOuverture = new Date(
      surprise.date + "T00:00:00"
    );

    const maintenant = new Date();


    const options = {
      day: "numeric",
      month: "long",
      year: "numeric"
    };


    if (maintenant < dateOuverture) {

      symbol.textContent = "🙊";

      app.innerHTML = `

        <div class="locked">

          <h2>Pas encore 🙊</h2>

          <p>
            Il faudra attendre le bon jour
            pour découvrir cette surprise 💌
          </p>

          <p class="date">
            Disponible le
            ${dateOuverture.toLocaleDateString("fr-FR", options)}
          </p>

          <p>
            🍓 🐚 🪷
          </p>

        </div>

      `;

    }


    else {

      symbol.textContent = "💌";

      app.innerHTML = `

        <div class="surprise">

          <h2>${surprise.titre}</h2>

          ${surprise.contenu}

          <p>
            <br>
            &lt;3 🐻
          </p>

        </div>

      `;

    }

  }

</script>

</body>
</html>
