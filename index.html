<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Calendrier Surprise <3</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f5e6e8, #e8edf5);
      color: #3d3d3d;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 600px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 30px;
      padding: 40px 25px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }

    h1 {
      margin-top: 0;
      font-size: 2.2em;
    }

    .symbol {
      font-size: 3.5em;
      margin: 20px 0;
    }

    .locked {
      line-height: 1.6;
      font-size: 1.1em;
    }

    .surprise {
      line-height: 1.6;
      font-size: 1.1em;
    }

    .date {
      font-weight: bold;
      margin-top: 20px;
    }

    img {
      max-width: 100%;
      border-radius: 20px;
      margin-top: 20px;
    }

    video {
      max-width: 100%;
      border-radius: 20px;
      margin-top: 20px;
    }

  </style>
</head>


<body>

  <main class="card">

    <h1>Calendrier Surprise <3</h1>

    <div class="symbol" id="symbol">🐚</div>

    <div id="app"></div>

  </main>


<script>

  /*
  ==========================================
  CALENDRIER DES SURPRISES
  ==========================================

  Chaque surprise possède :

  - un numéro
  - une date
  - un titre
  - un contenu

  Tu pourras modifier tout ça plus tard.
  */


  const surprises = {

    "1": {
      date: "2026-09-15",
      titre: "Une petite surprise <3",
      contenu: `
        <p>Une surprise arrivera ici bientôt 💌</p>
      `
    },


    "2": {
      date: "2026-10-10",
      titre: "Une nouvelle surprise 🍓",
      contenu: `
        <p>Quelque chose se prépare ici...</p>
      `
    },


    "3": {
      date: "2026-12-25",
      titre: "25 décembre 🪷",
      contenu: `
        <p>Ta surprise sera ajoutée ici.</p>
      `
    },


    "4": {
      date: "2027-02-20",
      titre: "20 février 🐻",
      contenu: `
        <p>Ta surprise sera ajoutée ici plus tard 💌</p>
      `
    }

  };


  /*
  ==========================================
  ON REGARDE QUEL QR CODE A ÉTÉ SCANNÉ
  ==========================================
  */


  const params = new URLSearchParams(window.location.search);

  const numero = params.get("surprise");

  const app = document.getElementById("app");

  const symbol = document.getElementById("symbol");


  /*
  ==========================================
  PAGE D'ACCUEIL
  ==========================================
  */


  if (!numero || !surprises[numero]) {

    symbol.textContent = "🐚";

    app.innerHTML = `

      <h2>Bienvenue <3</h2>

      <p>
        Scanne un QR code de ton calendrier
        pour découvrir une petite surprise 💌
      </p>

      <p>
        🙊 🧃 🍓 🐚 🪷 🐻
      </p>

    `;

  }


  /*
  ==========================================
  PAGE D'UNE SURPRISE
  ==========================================
  */


  else {

    const surprise = surprises[numero];

    const dateOuverture = new Date(
      surprise.date + "T00:00:00"
    );

    const maintenant = new Date();


    const options = {

      day: "numeric",
      month: "long",
      year: "numeric"

    };


    /*
    ==========================================
    SURPRISE VERROUILLÉE
    ==========================================
    */


    if (maintenant < dateOuverture) {

      symbol.textContent = "🙊";

      app.innerHTML = `

        <div class="locked">

          <h2>Pas encore 🙊</h2>

          <p>
            Il faudra attendre le bon jour
            pour découvrir cette surprise 💌
          </p>

          <p class="date">

            Disponible le
            ${dateOuverture.toLocaleDateString("fr-FR", options)}

          </p>

          <p>
            🍓 🐚 🪷
          </p>

        </div>

      `;

    }


    /*
    ==========================================
    SURPRISE DÉVERROUILLÉE
    ==========================================
    */


    else {

      symbol.textContent = "💌";

      app.innerHTML = `

        <div class="surprise">

          <h2>${surprise.titre}</h2>

          ${surprise.contenu}

          <p>
            <br>
            <3 🐻
          </p>

        </div>

      `;

    }

  }

</script>


</body>
</html>
