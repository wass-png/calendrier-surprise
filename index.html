<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Calendrier Surprise 💖</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffe6f0, #e6f0ff);
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 600px;
      background: white;
      border-radius: 25px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }

    h1 {
      margin-top: 0;
    }

    .emoji {
      font-size: 4em;
      margin: 15px;
    }

    .locked {
      display: none;
    }

    .surprise {
      display: none;
      line-height: 1.6;
      font-size: 1.1em;
    }

    .date {
      font-weight: bold;
      font-size: 1.1em;
    }

    img, video {
      max-width: 100%;
      border-radius: 15px;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <main class="card">

    <h1>💖 Calendrier Surprise 💖</h1>

    <div class="emoji" id="emoji">✨</div>

    <div id="app"></div>

  </main>


<script>

  /*
  ==================================================
  💖 TES SURPRISES
  ==================================================

  Tu pourras ajouter les dates et les contenus ici.

  IMPORTANT :
  Chaque surprise possède un numéro.

  Exemple :
  surprise=1
  surprise=2
  surprise=3

  La date doit être écrite :
  AAAA-MM-JJ
  ==================================================
  */

  const surprises = {

    "1": {
      date: "2026-09-15",
      titre: "Une petite surprise 💖",
      contenu: `
        <p>✨ Ta surprise sera ajoutée ici plus tard ! ✨</p>
      `
    },

    "2": {
      date: "2026-10-10",
      titre: "Une nouvelle surprise 🎁",
      contenu: `
        <p>💌 Une surprise t'attend ici...</p>
      `
    },

    "3": {
      date: "2026-12-25",
      titre: "Joyeux Noël ! 🎄",
      contenu: `
        <p>🎄 Joyeux Noël !! 💖</p>
        <p>Ta surprise sera ajoutée ici !</p>
      `
    },

    "4": {
      date: "2027-02-20",
      titre: "Surprise du 20 février 💕",
      contenu: `
        <p>💖 Cette surprise sera prête pour toi !</p>
      `
    }

  };


  /*
  ==================================================
  🔍 ON REGARDE QUEL QR CODE A ÉTÉ SCANNÉ
  ==================================================
  */

  const params = new URLSearchParams(window.location.search);

  const numero = params.get("surprise");

  const app = document.getElementById("app");

  const emoji = document.getElementById("emoji");


  /*
  ==================================================
  ❌ SI LE LIEN N'EST PAS VALIDE
  ==================================================
  */

  if (!numero || !surprises[numero]) {

    emoji.textContent = "📅";

    app.innerHTML = `
      <h2>Bienvenue ! 💖</h2>

      <p>
        Scanne un QR code de ton calendrier
        pour découvrir une surprise ✨
      </p>
    `;

  } else {

    const surprise = surprises[numero];

    /*
    On crée la date d'ouverture.
    */

    const dateOuverture = new Date(
      surprise.date + "T00:00:00"
    );

    const maintenant = new Date();


    const options = {
      day: "numeric",
      month: "long",
      year: "numeric"
    };


    /*
    ==================================================
    🔒 SURPRISE ENCORE VERROUILLÉE
    ==================================================
    */

    if (maintenant < dateOuverture) {

      emoji.textContent = "🔒";

      app.innerHTML = `
        <div class="locked">

          <h2>Cette surprise est encore verrouillée 🔒</h2>

          <p>
            Il faudra attendre encore un peu... ✨
          </p>

          <p class="date">
            💖 Disponible le
            ${dateOuverture.toLocaleDateString("fr-FR", options)}
          </p>

        </div>
      `;

    }


    /*
    ==================================================
    🎉 SURPRISE DÉVERROUILLÉE
    ==================================================
    */

    else {

      emoji.textContent = "🎁";

      app.innerHTML = `
        <div class="surprise">

          <h2>${surprise.titre}</h2>

          ${surprise.contenu}

        </div>
      `;

    }

  }

</script>

</body>
</html>
